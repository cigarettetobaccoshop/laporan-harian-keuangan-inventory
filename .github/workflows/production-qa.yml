name: Production QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep npm install until the repository has a committed lockfile.
      # Then switch this step to: npm ci
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
